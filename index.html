<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Random Chapter</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#121212;color:#f5f5f5;font:16px system-ui,sans-serif}
  main{min-height:100dvh;display:grid;place-items:center;padding:24px}section{width:min(100%,760px);text-align:center}
  h1{font-size:1.5rem;margin:0 0 12px}p{color:#bbb;line-height:1.45}button,label{display:inline-block;border:0;border-radius:999px;padding:13px 20px;background:#fff;color:#111;font:inherit;font-weight:650;cursor:pointer}label input{display:none}#reader{display:none;width:100%}#name{margin:0 0 12px;font-size:.9rem;color:#aaa;overflow-wrap:anywhere}canvas{display:block;max-width:100%;height:auto;margin:auto;background:#fff;box-shadow:0 4px 24px #0008}#reset{margin-top:20px;background:transparent;color:#ddd;border:1px solid #555;padding:9px 15px;font-size:.9rem}#status{min-height:1.5em}
</style>
<main><section id="setup"><h1>Random Chapter</h1><p id="status">Choose a PDF to get started.</p><label>Choose PDF<input id="picker" type="file" accept="application/pdf"></label></section><section id="reader"><p id="name"></p><canvas id="page"></canvas><button id="reset">Reset PDF</button></section></main>
<script>
  if(location.protocol==='file:'){document.querySelector('#status').textContent='Open this app from its HTTPS link, not directly from a downloaded file.';document.querySelector('#picker').closest('label').hidden=true}
</script>
<script type="module">
  import * as pdfjsLib from './pdf.min.mjs';
  pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.min.mjs';

  const setup=document.querySelector('#setup'), reader=document.querySelector('#reader'), picker=document.querySelector('#picker'), status=document.querySelector('#status'), name=document.querySelector('#name'), canvas=document.querySelector('#page');
  const openDB=()=>new Promise((resolve,reject)=>{const r=indexedDB.open('random-chapter',1);r.onupgradeneeded=()=>r.result.createObjectStore('pdf');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
  async function read(){const db=await openDB();return new Promise((resolve,reject)=>{const r=db.transaction('pdf').objectStore('pdf').get('current');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
  async function write(value){const db=await openDB();return new Promise((resolve,reject)=>{const r=db.transaction('pdf','readwrite').objectStore('pdf').put(value,'current');r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}
  async function clear(){const db=await openDB();return new Promise((resolve,reject)=>{const r=db.transaction('pdf','readwrite').objectStore('pdf').delete('current');r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}
  async function bookmarkPages(pdf){
    const outline=await pdf.getOutline(); if(!outline) return [];
    const pages=[];
    async function visit(items){for(const item of items){if(item.items?.length) await visit(item.items); else if(item.dest){try{const dest=typeof item.dest==='string'?await pdf.getDestination(item.dest):item.dest;if(dest) pages.push((await pdf.getPageIndex(dest[0]))+1)}catch{}}}}
    await visit(outline); return [...new Set(pages)].sort((a,b)=>a-b);
  }
  async function render(blob,pages,fileName){
    const bytes=new Uint8Array(await blob.arrayBuffer());
    const pdf=await pdfjsLib.getDocument({data:bytes}).promise;
    if(!pages?.length) pages=await bookmarkPages(pdf);
    if(!pages.length) pages=Array.from({length:pdf.numPages},(_,i)=>i+1);
    const selected=pages[Math.floor(Math.random()*pages.length)];
    const page=await pdf.getPage(selected), base=page.getViewport({scale:1}), viewport=page.getViewport({scale:Math.min(720,innerWidth-48)/base.width}), ratio=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.ceil(viewport.width*ratio);canvas.height=Math.ceil(viewport.height*ratio);canvas.style.width=`${viewport.width}px`;canvas.style.height=`${viewport.height}px`;
    await page.render({canvasContext:canvas.getContext('2d'),viewport,transform:ratio===1?null:[ratio,0,0,ratio,0,0]}).promise;
    name.textContent=`${fileName} — ${pages.length===pdf.numPages?'random page':'random bookmarked chapter'} (page ${selected})`;
    setup.style.display='none';reader.style.display='block';
    return {pages};
  }
  picker.onchange=async()=>{const file=picker.files[0];if(!file)return;try{status.textContent='Finding chapters…';const result=await render(file,[],file.name);await write({blob:file,name:file.name,pages:result.pages});navigator.storage?.persist?.()}catch(error){status.textContent=`Could not open this PDF: ${error.message}`}};
  document.querySelector('#reset').onclick=async()=>{await clear();reader.style.display='none';setup.style.display='block';status.textContent='Choose a PDF to get started.';picker.value=''};
  try{const saved=await read();if(saved)await render(saved.blob,saved.pages,saved.name)}catch(error){status.textContent=`Storage is unavailable: ${error.message}`}
</script>
</html>
